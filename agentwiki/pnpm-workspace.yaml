packages:
  - 'apps/*'
  - 'packages/*'
linkWorkspacePackages: true
overrides:
  '@hono/node-server': '2.1.0'
  ajv@>=7.0.0-alpha.0 <8.18.0: '8.18.0'
  body-parser: '1.20.6'
  browserslist: '4.28.8'
  brace-expansion@<1.1.21: '1.1.21'
  brace-expansion@>=2.0.0 <2.1.7: '2.1.7'
  brace-expansion@>=4.0.0 <5.0.11: '5.0.12'
  fast-uri: '>=4.1.5'
  engine.io: '6.6.11'
  file-type@>=13.0.0 <21.3.2: '21.3.2'
  glob@>=10.2.0 <10.5.0: '10.5.0'
  hono: '4.13.13'
  ip-address: '>=10.7.1'
  js-yaml@>=3.0.0 <3.15.2: '3.15.2'
  js-yaml@>=4.0.0 <4.3.2: '4.3.2'
  katex: '0.18.4'
  lodash: '>=4.17.24'
  multer: '2.4.0'
  'nanoid@3': '>=3.3.17 <4'
  picomatch: '4.0.4'
  postcss: '>=8.5.18'
  proxy-addr: '2.0.8'
  qs: '6.16.0'
  source-map-js: '1.2.2'
  socket.io-parser: '>=4.2.7 <5'
  handlebars: '4.7.10'
  tmp@<0.2.7: '0.2.7'
  webpack@>=5.49.0 <5.104.1: '>=5.104.1'
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: false
  msgpackr-extract: set this to true or false
  opencode-ai: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - opencode-ai@1.18.12
  - opencode-darwin-arm64@1.18.12
  - opencode-darwin-x64-baseline@1.18.12
  - opencode-darwin-x64@1.18.12
  - opencode-linux-arm64-musl@1.18.12
  - opencode-linux-arm64@1.18.12
  - opencode-linux-x64-baseline-musl@1.18.12
  - opencode-linux-x64-baseline@1.18.12
  - opencode-linux-x64-musl@1.18.12
  - opencode-linux-x64@1.18.12
  - opencode-windows-arm64@1.18.12
  - opencode-windows-x64-baseline@1.18.12
  - opencode-windows-x64@1.18.12
  - tmp@0.2.7
  - glob@10.5.0
  - ajv@8.18.0
  - file-type@21.3.2
  - picomatch@4.0.4
  - brace-expansion@1.1.18 || 2.1.4 || 5.0.9
  - browserslist@4.28.8
  - js-yaml@3.15.2 || 4.3.2
  - qs@6.16.0
  - express@5.3.0
onlyBuiltDependencies: [ unrs-resolver ]
