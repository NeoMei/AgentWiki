services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli INFO persistence | grep -q '^aof_enabled:1'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    image: agentwiki-backend:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    container_name: agentwiki-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${APP_SECRET:?APP_SECRET is required}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET is required}
      CORS_ORIGINS: ${CLIENT_URL:?CLIENT_URL is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      LOCAL_SYNC_PACKAGE_VERSION: ${LOCAL_SYNC_PACKAGE_VERSION:-0.7.0}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-100.64.35.78,localhost,127.0.0.1}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com}
      ASSIST_OPENCODE_FREE_MODELS: ${ASSIST_OPENCODE_FREE_MODELS:-opencode/big-pickle}
      ASSIST_OPENCODE_ALLOW_PAID_FALLBACK: ${ASSIST_OPENCODE_ALLOW_PAID_FALLBACK:-true}
      ASSIST_MAX_OUTSTANDING_PER_USER: ${ASSIST_MAX_OUTSTANDING_PER_USER:-10}
      ASSIST_OPENCODE_MAX_FREE_ATTEMPTS: ${ASSIST_OPENCODE_MAX_FREE_ATTEMPTS:-3}
      ASSIST_OPENCODE_MAX_PAID_ATTEMPTS: ${ASSIST_OPENCODE_MAX_PAID_ATTEMPTS:-1}
      ASSIST_OPENCODE_TIMEOUT_MS: ${ASSIST_OPENCODE_TIMEOUT_MS:-180000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ATTACHMENT_STORAGE_PATH: /var/lib/agentwiki/attachments
      ATTACHMENT_MAX_FILE_BYTES: ${ATTACHMENT_MAX_FILE_BYTES:-10485760}
      ATTACHMENT_MAX_SPACE_BYTES: ${ATTACHMENT_MAX_SPACE_BYTES:-524288000}
      ATTACHMENT_MAX_DIMENSION: ${ATTACHMENT_MAX_DIMENSION:-10000}
      ATTACHMENT_MAX_PIXELS: ${ATTACHMENT_MAX_PIXELS:-40000000}
      ATTACHMENT_MIN_FREE_BYTES: ${ATTACHMENT_MIN_FREE_BYTES:-1073741824}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-30}
      ATTACHMENT_ORPHAN_GRACE_HOURS: ${ATTACHMENT_ORPHAN_GRACE_HOURS:-24}
      ATTACHMENT_CONTENT_LOCK_TIMEOUT_MS: ${ATTACHMENT_CONTENT_LOCK_TIMEOUT_MS:-5000}
      ATTACHMENT_CLEANUP_POLL_MS: ${ATTACHMENT_CLEANUP_POLL_MS:-3600000}
      PROCESS_ROLE: api
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - attachment-data:/var/lib/agentwiki/attachments
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const body=await r.json();process.exit(r.ok&&body.status==='ok'&&body.attachmentStorage==='ok'?0:1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    image: agentwiki-backend:latest
    container_name: agentwiki-worker
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${APP_SECRET:?APP_SECRET is required}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET is required}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com}
      ATTACHMENT_STORAGE_PATH: /var/lib/agentwiki/attachments
      ATTACHMENT_MAX_FILE_BYTES: ${ATTACHMENT_MAX_FILE_BYTES:-10485760}
      ATTACHMENT_MAX_SPACE_BYTES: ${ATTACHMENT_MAX_SPACE_BYTES:-524288000}
      ATTACHMENT_MAX_DIMENSION: ${ATTACHMENT_MAX_DIMENSION:-10000}
      ATTACHMENT_MAX_PIXELS: ${ATTACHMENT_MAX_PIXELS:-40000000}
      ATTACHMENT_MIN_FREE_BYTES: ${ATTACHMENT_MIN_FREE_BYTES:-1073741824}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-30}
      ATTACHMENT_ORPHAN_GRACE_HOURS: ${ATTACHMENT_ORPHAN_GRACE_HOURS:-24}
      ATTACHMENT_CONTENT_LOCK_TIMEOUT_MS: ${ATTACHMENT_CONTENT_LOCK_TIMEOUT_MS:-5000}
      ATTACHMENT_CLEANUP_POLL_MS: ${ATTACHMENT_CLEANUP_POLL_MS:-3600000}
      PROCESS_ROLE: worker
      NODE_ENV: production
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      INGEST_LEASE_MS: ${INGEST_LEASE_MS:-300000}
      INGEST_QUEUE_POLL_MS: ${INGEST_QUEUE_POLL_MS:-1000}
      INGEST_RECOVERY_POLL_MS: ${INGEST_RECOVERY_POLL_MS:-30000}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=268435456,mode=1777
    volumes:
      - attachment-data:/var/lib/agentwiki/attachments
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: agentwiki-frontend:latest
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    container_name: agentwiki-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: agentwiki-backend:latest
    profiles: ["tools"]
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

volumes:
  redis-data:
  attachment-data:
