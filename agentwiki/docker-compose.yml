services:
  backend:
    image: agentwiki-backend:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26-alpine}
    container_name: agentwiki-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${APP_SECRET:?APP_SECRET is required}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET is required}
      CORS_ORIGINS: ${CLIENT_URL:?CLIENT_URL is required}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-100.64.35.78,localhost,127.0.0.1}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com}
      PROCESS_ROLE: api
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    image: agentwiki-backend:latest
    container_name: agentwiki-worker
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${APP_SECRET:?APP_SECRET is required}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET is required}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com}
      PROCESS_ROLE: worker
      NODE_ENV: production
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      INGEST_LEASE_MS: ${INGEST_LEASE_MS:-300000}
      INGEST_QUEUE_POLL_MS: ${INGEST_QUEUE_POLL_MS:-1000}
      INGEST_RECOVERY_POLL_MS: ${INGEST_RECOVERY_POLL_MS:-30000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: agentwiki-frontend:latest
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    container_name: agentwiki-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: agentwiki-backend:latest
    profiles: ["tools"]
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"
